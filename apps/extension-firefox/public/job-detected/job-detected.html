<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offlyn – Job detected</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="../shared/theme-init.js"></script>
  <style>
    /* ── Design Tokens ── */
    :root {
      --black: #18181b;
      --white: #ffffff;
      --off-white: #faf9f6;
      --green: #1e5e41;
      --green-light: #edf6f1;
      --green-mid: #2d8a60;
      --accent: #1e5e41;
      --accent-subtle: #edf6f1;
      --accent-border: #c8e4d6;
      --accent-hover: #164932;
      --gray-100: #f4f3ee;
      --gray-200: #e6e4dc;
      --gray-400: #9b988f;
      --gray-600: #57554f;
      --gray-800: #272623;
      --border: #e5e3dc;
      --border-subtle: #eeece5;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --font-serif: 'Lora', Georgia, serif;
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    html.dark {
      --black: #f4f4f5;
      --white: #18181b;
      --off-white: #121214;
      --green: #34a873;
      --green-light: #162d22;
      --green-mid: #3ebd83;
      --accent: #34a873;
      --accent-subtle: #162d22;
      --accent-border: #1d4332;
      --accent-hover: #3ebd83;
      --gray-100: #1e1e23;
      --gray-200: #2b2b31;
      --gray-400: #7a7a85;
      --gray-600: #a8a8b2;
      --gray-800: #e4e4e9;
      --border: #2b2b31;
      --border-subtle: #222227;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      font-size: 15px;
      color: var(--black);
      background: var(--off-white);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 400px;
      width: 100%;
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      padding: 24px;
    }
    .card h1 { font-family: var(--font-serif); font-size: 18px; margin-bottom: 8px; color: var(--green); font-weight: 500; }
    .card .company { color: var(--gray-600); font-size: 14px; margin-bottom: 20px; }
    .card .hostname { font-size: 12px; color: var(--gray-400); margin-bottom: 20px; }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      font-family: var(--font-sans);
    }
    .btn:hover { background: var(--green-mid); }
    .btn.secondary { background: var(--gray-600); }
    .btn.secondary:hover { background: var(--gray-800); }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="job-title">Job detected</h1>
    <p class="company" id="job-company"></p>
    <p class="hostname" id="job-hostname"></p>
    <div class="actions">
      <button type="button" class="btn" id="btn-focus">Focus application tab</button>
      <a href="#" id="link-onboarding" class="btn secondary">Set up profile</a>
    </div>
  </div>
  <script src="job-detected.js"></script>
  <script src="../shared/dark-mode.js"></script>
</body>
</html>

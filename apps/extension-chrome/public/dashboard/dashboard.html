<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="48x48" href="../icons/icon-48.png">
  <title>Application Dashboard - Private Apply</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="../shared/theme-init.js"></script>
  <script src="chart.umd.min.js"></script>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <!-- Sticky Header -->
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <img src="../icons/primary-logo.png" alt="Private Apply">
        <h1>Application Dashboard</h1>
      </div>
      <div class="header-actions">
        <button id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode"></button>
        <button id="viewLearnedValuesBtn" class="btn-learned">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z"/><path d="M12 8v4l3 3"/></svg>
          Learned Values
        </button>
        <a href="../home/home.html" class="btn-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Back to Home
        </a>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Stats Cards -->
    <div class="stats">
      <div class="stat-card total">
        <div class="number" id="statTotal">0</div>
        <div class="label">Total Applications</div>
      </div>
      <div class="stat-card submitted">
        <div class="number" id="statSubmitted">0</div>
        <div class="label">Submitted</div>
      </div>
      <div class="stat-card interviewing">
        <div class="number" id="statInterviewing">0</div>
        <div class="label">Interviewing</div>
      </div>
      <div class="stat-card accepted">
        <div class="number" id="statAccepted">0</div>
        <div class="label">Accepted</div>
      </div>
      <div class="stat-card rejected">
        <div class="number" id="statRejected">0</div>
        <div class="label">Rejected</div>
      </div>
      <div class="stat-card rate">
        <div class="number" id="statRate">0%</div>
        <div class="label">Response Rate</div>
      </div>
    </div>

    <!-- Charts -->
    <div class="charts">
      <div class="chart-card">
        <h3>Applications Over Time</h3>
        <div class="chart-container">
          <canvas id="trendChart"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <h3>Status Distribution</h3>
        <div class="chart-container">
          <canvas id="statusChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Search / Filter / Export Toolbar -->
    <div class="toolbar">
      <div class="toolbar-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search by company, position, or notes...">
      </div>
      <div class="toolbar-filter">
        <select id="filterStatus" aria-label="Filter by status">
          <option value="all">All Status</option>
          <option value="submitted">Submitted</option>
          <option value="interviewing">Interviewing</option>
          <option value="rejected">Rejected</option>
          <option value="accepted">Accepted</option>
          <option value="withdrawn">Withdrawn</option>
        </select>
      </div>
      <button class="btn-export" id="exportBtn" aria-label="Export applications as CSV">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export CSV
      </button>
      <button class="btn-import" id="importBtn" aria-label="Import applications from CSV or JSON">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Import CSV
      </button>
      <input type="file" id="importFileInput" accept=".csv,.json" style="display:none">
      <button class="btn-clear-data" id="clearDataBtn" title="Clear all application data">
        Clear All Data
      </button>
    </div>

    <!-- Kanban Board -->
    <div class="kanban-container">
      <div id="kanbanContent">
        <div class="loading">
          <div class="loading-spinner"></div>
          <p>Loading applications...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h2>Edit Application</h2>
      <form id="editForm">
        <div class="form-group">
          <label>Company</label>
          <input type="text" id="editCompany" readonly>
        </div>
        <div class="form-group">
          <label>Position</label>
          <input type="text" id="editPosition" readonly>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="editStatus" required>
            <option value="submitted">Submitted</option>
            <option value="interviewing">Interviewing</option>
            <option value="rejected">Rejected</option>
            <option value="accepted">Accepted</option>
            <option value="withdrawn">Withdrawn</option>
          </select>
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="editNotes" placeholder="Add notes about this application..."></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Save</button>
          <button type="button" class="btn-secondary" id="cancelEditBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="dashboard.js"></script>
  <script src="../shared/dark-mode.js"></script>
</body>
</html>

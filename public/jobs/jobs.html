<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="48x48" href="../icons/icon-48.png">
  <title>Find Jobs - Private Apply</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="../shared/theme-init.js"></script>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="jobs.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <img src="../icons/primary-logo.png" alt="Private Apply">
        <h1>Find Jobs</h1>
      </div>
      <div class="header-actions">
        <button id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode"></button>
        <button type="button" class="btn-back" onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href = '../home/home.html'; }" title="Go back">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back
        </button>
        <a href="../home/home.html" class="btn-back" title="Return to Home">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="search-bar">
      <div class="ac-wrap" id="ac-keywords-wrap">
        <input type="text" id="search-keywords" class="search-keywords" placeholder="Job title or keywords..." autocomplete="off">
        <div class="ac-dropdown" id="ac-keywords-dropdown"></div>
      </div>
      <div class="ac-wrap ac-location" id="ac-location-wrap">
        <input type="text" id="search-location" class="search-location" placeholder="City, state, or 'remote'" autocomplete="off">
        <div class="ac-dropdown" id="ac-location-dropdown"></div>
      </div>
      <button class="btn-search" id="btn-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Search
      </button>
    </div>

    <div class="filters-row" id="filters-row">
      <select id="search-days" class="search-days">
        <option value="">Any time</option>
        <option value="1">Past 24h</option>
        <option value="3">Past 3 days</option>
        <option value="7">Past week</option>
        <option value="30">Past month</option>
      </select>
      <select id="search-sort">
        <option value="default">Sort: Relevance</option>
        <option value="date">Sort: Most recent</option>
        <option value="salary">Sort: Highest salary</option>
        <option value="compatibility">Sort: Best Match %</option>
      </select>
      <div class="filter-group">
        <span class="filter-label">Salary</span>
        <input type="number" id="salary-min" class="salary-input" placeholder="Min" step="10000" min="0">
        <span class="salary-dash">&ndash;</span>
        <input type="number" id="salary-max" class="salary-input" placeholder="Max" step="10000" min="0">
      </div>
      <label class="filter-pill" id="pill-remote">
        <input type="checkbox" id="search-remote">
        Remote
      </label>
      <label class="filter-pill" id="pill-fulltime">
        <input type="checkbox" id="search-fulltime">
        Full-time
      </label>
      <label class="filter-pill" id="pill-contract">
        <input type="checkbox" id="search-contract">
        Contract
      </label>
    </div>

    <div class="scheduled-banner" id="scheduled-banner" style="display:none;">
      <div class="scheduled-banner-icon" id="scheduled-count">0</div>
      <div class="scheduled-banner-text">
        <strong>New jobs found based on your preferences</strong>
        <small>Background search discovered matching opportunities</small>
      </div>
      <div class="scheduled-banner-actions">
        <button class="btn-banner btn-banner-primary" id="scheduled-view-btn">View</button>
        <button class="btn-banner btn-banner-dismiss" id="scheduled-dismiss-btn">Dismiss</button>
      </div>
    </div>

    <div class="results-info" id="results-info" style="display:none;">
      <span id="results-count"></span>
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-results" data-tab="results">Results</button>
        <button class="tab-btn" id="tab-saved" data-tab="saved">Saved</button>
      </div>
    </div>

    <div id="results-container">
      <div class="empty-state" id="empty-state">
        <h3>Search for jobs</h3>
        <p>Enter keywords and location to discover job opportunities.</p>
      </div>
    </div>

    <div id="loading" class="loading" style="display:none;">
      <div class="loading-spinner"></div>
      <p>Searching jobs...</p>
    </div>

    <div class="jobs-grid" id="jobs-grid" style="display:none;"></div>
    <div class="jobs-grid" id="saved-grid" style="display:none;"></div>
  </div>

  <script src="jobs.js"></script>
  <script src="../shared/dark-mode.js"></script>
</body>
</html>
